name = "ROSlean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ROSlean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib copyright headers here
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# The executable core (model and C interface) is a package of its own, so that
# building a ROS node never needs Mathlib.
[[require]]
name = "ROSleanCore"
path = "core"

[[lean_lib]]
name = "ROSlean"
