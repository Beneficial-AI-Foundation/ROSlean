name = "ROSlean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ROSlean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib copyright headers here
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "ROSlean"

# Executable core. Lake compiles it to C (.lake/build/ir); the ROS package
# `roslean_core` compiles and links that C. Must not import Mathlib.
[[lean_lib]]
name = "ROSleanCore"
