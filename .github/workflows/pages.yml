name: Project page

# Publishes site/ (plain HTML, no build step) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
# This must be the only workflow that deploys to Pages.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # The artifact may not be visible to deploy-pages immediately after upload.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.retry_deployment.outcome == 'failure'
        run: sleep 20
      - id: final_deployment
        if: steps.retry_deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
