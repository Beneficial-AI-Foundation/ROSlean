name: Project page

# Publishes site/ (plain HTML, no build step) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
# This must be the only workflow that deploys to Pages. If a run fails, start a
# fresh one ("Run workflow") instead of "Re-run jobs": a re-run uploads a second
# "github-pages" artifact into the same run and deploy-pages rejects it.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
