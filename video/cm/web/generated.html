<!doctype html>
<!-- The collision monitor video, drawn: the robot follows the poses recorded
     in Gazebo; the box, the lidar points, the colours, the lit zone and the
     panel come from the messages of that run (data.js). The zones have the
     shapes of monitor.yaml and move with the robot; which of them is lit is
     what the monitor's state topic said. Nothing here tests whether a point
     is inside a zone or re-computes a decision of the monitor. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../web/common.css">
<link rel="stylesheet" href="cm.css">
<style>
  canvas { position: absolute; left: 0; top: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "../../node_modules/three/build/three.module.js",
               "three/addons/": "../../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"><div id="tag"></div></div>
<script src="data.js"></script>
<script src="story.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const D = window.DATA, FPS = 30, N = Math.round(LENGTH * FPS), WIDTH = 1920, HEIGHT = 1080;
const update = buildStory({
  footer: 'Lean 4 · ROS 2 Jazzy',
  shade: 0.9,
  beats: { lean: {
    title: 'This is its Lean implementation at work.',
    sub: 'A replay of a recorded run. Every pass, slow-down or stop decision was made by a Lean 4 function with machine-checked rules.' } },
});
document.getElementById('brand').insertAdjacentHTML('beforeend', '<div class="where">REPLAY OF A RECORDED RUN</div>');
const tag = document.getElementById('tag');

// The planner's route (WAYPOINTS in the mux demo's patrol.py).
const ROUTE = [[0.4, 0.2], [0.4, -2.5], [-2.0, -2.5], [-2.0, 0.2]];
// The robot of the twist_mux video, here at the size of a TurtleBot3 burger
// (0.14 m long, 0.18 m wide over the wheels, centred 3 cm behind the base's
// origin), because the zones and the box are drawn to scale.
const SCALE = 0.47, BODY_X = -0.03;
const WHEEL_R = 0.066, TRACK = 0.384;
const LIDAR_Z = 0.18;              // height of the lidar's beam above the floor

// ---- Recorded motion ----
const P = D.pose;
function poseAt(t) {
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][0] <= t) lo = m; else hi = m; }
  const a = P[lo], b = P[hi], k = clamp((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
  let dyaw = b[3] - a[3]; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
  return { x: a[1] + (b[1] - a[1]) * k, y: a[2] + (b[2] - a[2]) * k, yaw: a[3] + dyaw * k, i: lo, k };
}
// Wheel angles, from the distance each wheel has rolled.
const wheel = [[0, 0]];
for (let i = 1; i < P.length; i++) {
  const a = P[i - 1], b = P[i];
  const ds = (b[1] - a[1]) * Math.cos(a[3]) + (b[2] - a[2]) * Math.sin(a[3]);
  let dyaw = b[3] - a[3]; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
  const half = dyaw * TRACK / 2 * SCALE;
  wheel.push([wheel[i - 1][0] + (ds - half) / WHEEL_R / SCALE, wheel[i - 1][1] + (ds + half) / WHEEL_R / SCALE]);
}

// ---- Scene (z up, metres, the same coordinates as the simulation) ----
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
document.getElementById('stage').prepend(renderer.domElement);

const BG = new THREE.Color('#0a0e16');
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 7, 19);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.30;

const camera = new THREE.PerspectiveCamera(30, WIDTH / HEIGHT, 0.1, 80);
camera.up.set(0, 0, 1);
camera.setViewOffset(WIDTH, HEIGHT, -90, -70, WIDTH, HEIGHT);   // robot right of and below centre

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x10131a, 0.30));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 5;
sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2, near: 1, far: 30 });
scene.add(sun, sun.target);

// Floor with a faint grid: bold lines every metre, light ones every 25 cm.
function gridTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#10151f'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i <= 4; i++) {
    g.fillStyle = i % 4 === 0 ? 'rgba(150,180,230,0.16)' : 'rgba(150,180,230,0.05)';
    const w = i % 4 === 0 ? 6 : 3, p = i * 256 - w / 2;
    g.fillRect(p, 0, w, 1024); g.fillRect(0, p, 1024, w);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(80, 80);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ map: gridTexture(), roughness: 0.78, metalness: 0.0, envMapIntensity: 0.25 }));
floor.receiveShadow = true;
scene.add(floor);

const flat = (color, opacity = 1) => new THREE.MeshBasicMaterial({
  color, transparent: true, opacity, depthWrite: false, toneMapped: false, side: THREE.DoubleSide });

// The planner's route: dashes and a disc at each waypoint.
const route = new THREE.Group();
const dash = new THREE.PlaneGeometry(0.07, 0.012);
ROUTE.forEach((a, i) => {
  const b = ROUTE[(i + 1) % ROUTE.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  for (let s = 0.15; s < len - 0.10; s += 0.15) {
    const m = new THREE.Mesh(dash, flat(COLORS.planner, 0.34));
    m.position.set(a[0] + (b[0] - a[0]) * s / len, a[1] + (b[1] - a[1]) * s / len, 0.002);
    m.rotation.z = Math.atan2(b[1] - a[1], b[0] - a[0]);
    route.add(m);
  }
  const disc = new THREE.Mesh(new THREE.RingGeometry(0.035, 0.05, 48), flat(COLORS.planner, 0.5));
  disc.position.set(a[0], a[1], 0.002);
  route.add(disc);
});
scene.add(route);

// ---- The robot ----
function zCylinder(r1, r2, h, seg = 64, open = false, start = 0, len = Math.PI * 2) {
  return new THREE.CylinderGeometry(r1, r2, h, seg, 1, open, start, len).rotateX(Math.PI / 2);
}
function lathe(points) {
  const curve = new THREE.SplineCurve(points.map(([r, z]) => new THREE.Vector2(r, z)));
  return new THREE.LatheGeometry(curve.getPoints(40), 96).rotateX(Math.PI / 2);
}
const shellMat = new THREE.MeshPhysicalMaterial({ color: 0xdfe3ea, roughness: 0.36, clearcoat: 0.6, clearcoatRoughness: 0.25 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1e27, roughness: 0.45, metalness: 0.5 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x0c0e12, roughness: 0.92 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x06080c, roughness: 0.12, metalness: 0.7, clearcoat: 1, side: THREE.DoubleSide });
const ledMat = new THREE.MeshBasicMaterial({ color: COLORS.pass, toneMapped: false });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xdff6ff, toneMapped: false });

const base = new THREE.Group();          // the robot's base frame: x ahead, y to the left
const robot = new THREE.Group(), wheels = [];
{
  const add = (geometry, material, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geometry, material); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; robot.add(m); return m;
  };
  add(lathe([[0, 0.030], [0.13, 0.030], [0.162, 0.040], [0.172, 0.060], [0.172, 0.100]]), darkMat);
  add(lathe([[0.172, 0.108], [0.173, 0.150], [0.166, 0.180], [0.146, 0.200], [0.105, 0.212], [0.05, 0.216], [0, 0.217]]), shellMat);
  add(new THREE.TorusGeometry(0.1725, 0.0055, 16, 128), ledMat, 0, 0, 0.104).castShadow = false;
  // Visor with two lights, at the front.
  add(zCylinder(0.1742, 0.1742, 0.046, 64, true, Math.PI / 2 - 0.78, 1.56), glass, 0, 0, 0.142).castShadow = false;
  for (const a of [-0.27, 0.27]) {
    const eye = add(new THREE.SphereGeometry(0.011, 24, 16), eyeMat, 0.1750 * Math.cos(a), 0.1750 * Math.sin(a), 0.142);
    eye.scale.set(0.5, 1.5, 1); eye.rotation.z = a; eye.castShadow = false;
  }
  // Wheels, outside the body.
  for (const side of [-1, 1]) {
    const w = new THREE.Group(); w.position.set(0, side * TRACK / 2, WHEEL_R);
    const tyre = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.034, 64), rubber);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.040, 0.040, 0.038, 48), shellMat);
    tyre.castShadow = hub.castShadow = true; w.add(tyre, hub);
    for (let i = 0; i < 3; i++) {                         // spokes, so that rolling shows
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.074, 0.040, 0.012), darkMat);
      spoke.rotation.y = i * Math.PI / 3; w.add(spoke);
    }
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.05, 24), darkMat);
    axle.position.y = -side * 0.025; w.add(axle);
    robot.add(w); wheels.push(w);
  }
  add(new THREE.SphereGeometry(0.022, 24, 16), darkMat, 0.125, 0, 0.022);
  add(new THREE.SphereGeometry(0.022, 24, 16), darkMat, -0.125, 0, 0.022);
  // Lidar on top; its head spins.
  add(zCylinder(0.050, 0.054, 0.016), darkMat, 0, 0, 0.222);
  const head = new THREE.Group(); head.position.z = 0.248; robot.add(head);
  const drum = new THREE.Mesh(zCylinder(0.042, 0.042, 0.036), darkMat); drum.castShadow = true;
  const lens = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.030, 0.012), eyeMat); lens.position.x = 0.042;
  head.add(drum, lens); robot.userData.head = head;
  add(zCylinder(0.044, 0.044, 0.004), darkMat, 0, 0, 0.268);
  robot.scale.setScalar(SCALE);
  robot.position.x = BODY_X;
}
base.add(robot);
scene.add(base);

// ---- The two zones, in the base frame, with the shapes of monitor.yaml ----
// A filled polygon and its outline (a strip along each edge), flat on the floor.
function outline(points, width) {
  const pos = [];
  points.forEach((a, i) => {
    const b = points[(i + 1) % points.length], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    const ux = dx / len * width / 2, uy = dy / len * width / 2, nx = -uy, ny = ux;
    const q = [[a[0] - ux + nx, a[1] - uy + ny], [a[0] - ux - nx, a[1] - uy - ny],
               [b[0] + ux + nx, b[1] + uy + ny], [b[0] + ux - nx, b[1] + uy - ny]];
    for (const k of [0, 1, 2, 2, 1, 3]) pos.push(q[k][0], q[k][1], 0);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
const zones = {};
Object.entries(D.zones).forEach(([name, z], i) => {
  const color = z.action === 'stop' ? COLORS.stop : COLORS.slow;
  const shape = new THREE.Shape(z.points.map(([x, y]) => new THREE.Vector2(x, y)));
  const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), flat(color, 0.03));
  const edge = new THREE.Mesh(outline(z.points, 0.010), flat(color, 0.5));
  fill.position.z = 0.0035 + 0.001 * (z.action === 'stop'); edge.position.z = fill.position.z + 0.0005;
  fill.renderOrder = edge.renderOrder = 2 + (z.action === 'stop');
  base.add(fill, edge);
  zones[name] = { fill, edge, lit: 0 };
});
// How strongly each zone is lit at time t: 1 while the state topic names it,
// with a short ramp so that the change does not flicker on one frame.
function litAt(name, t) {
  const k = lastAtOrBefore(D.stateT, t);
  if (k < 0) return 0;
  const on = D.stateZone[k] === name, since = t - D.stateT[k];
  const before = k > 0 && D.stateZone[k - 1] === name;
  const ramp = clamp(since / 0.12);
  return on ? (before ? 1 : ramp) : (before ? 1 - ramp : 0);
}

// ---- The box ----
const box = new THREE.Mesh(new THREE.BoxGeometry(D.box.size, D.box.size, D.box.size),
  new THREE.MeshStandardMaterial({ color: 0xe5591a, roughness: 0.55, metalness: 0.0, transparent: true }));
box.castShadow = true; box.receiveShadow = true;
box.position.set(D.box.x, D.box.y, D.box.size / 2);
box.rotation.z = D.box.yaw;
const boxEdges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),
  new THREE.LineBasicMaterial({ color: 0xffb38a, transparent: true, opacity: 0.55 }));
box.add(boxEdges);
scene.add(box);

// ---- The lidar's points of the newest scan, where the robot was when it was taken ----
function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.45, 'rgba(255,255,255,0.9)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const MAXP = 400;
const dotsGeometry = new THREE.BufferGeometry();
dotsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
dotsGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAXP * 4), 4));
const dots = new THREE.Points(dotsGeometry, new THREE.PointsMaterial({
  size: 0.042, map: dotTexture(), vertexColors: true, transparent: true, depthWrite: false, toneMapped: false }));
dots.frustumCulled = false;
scene.add(dots);
function drawScan(t, body) {
  const n = lastAtOrBefore(D.scanT, t);
  if (n < 0) { dotsGeometry.setDrawRange(0, 0); return; }
  const pts = D.scan[n], p = poseAt(D.scanT[n]), c = Math.cos(p.yaw), s = Math.sin(p.yaw);
  const pos = dotsGeometry.attributes.position.array, col = dotsGeometry.attributes.color.array;
  const count = Math.min(MAXP, pts.length / 2);
  for (let i = 0; i < count; i++) {
    const x = pts[2 * i], y = pts[2 * i + 1];
    pos.set([p.x + c * x - s * y, p.y + s * x + c * y, LIDAR_Z], i * 3);
    // Fainter with distance from the robot, so that the far walls do not distract.
    col.set([0.85, 1.0, 1.0, mix(1, 0.22, clamp((Math.hypot(x, y) - 1.1) / 1.3))], i * 4);
  }
  dotsGeometry.setDrawRange(0, count);
  dotsGeometry.attributes.position.needsUpdate = true;
  dotsGeometry.attributes.color.needsUpdate = true;
  dots.material.opacity = body * (0.95 - 0.45 * clamp((t - D.scanT[n]) / 0.2));
}

// Trail: a ribbon along the path, coloured by what the monitor published.
const TRAIL_HZ = 20, TRAIL_AGE = 18, HALF = 0.011;
const trailPoints = [];
for (let t = 0; t < LENGTH; t += 1 / TRAIL_HZ) {
  const p = poseAt(t), s = monitorState(t);
  trailPoints.push({ t, x: p.x, y: p.y, color: s.kind === 'idle' ? null : new THREE.Color(stateColor(s)) });
}
const MAXQ = TRAIL_HZ * TRAIL_AGE + 4;
const trailGeometry = new THREE.BufferGeometry();
trailGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXQ * 18), 3));
trailGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAXQ * 24), 4));
const trail = new THREE.Mesh(trailGeometry, new THREE.MeshBasicMaterial({
  vertexColors: true, transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide }));
trail.frustumCulled = false;
trail.renderOrder = 1;
scene.add(trail);
function drawTrail(t) {
  const pos = trailGeometry.attributes.position.array, col = trailGeometry.attributes.color.array;
  let q = 0;
  for (let i = 1; i < trailPoints.length && trailPoints[i].t <= t && q < MAXQ; i++) {
    const a = trailPoints[i - 1], b = trailPoints[i], age = t - b.t;
    if (!b.color || age > TRAIL_AGE) continue;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < 1e-5) continue;
    const nx = -dy / len * HALF, ny = dx / len * HALF, z = 0.003;
    const quad = [[a.x + nx, a.y + ny], [a.x - nx, a.y - ny], [b.x + nx, b.y + ny],
                  [b.x + nx, b.y + ny], [a.x - nx, a.y - ny], [b.x - nx, b.y - ny]];
    const alpha = 0.85 * (1 - age / TRAIL_AGE);
    quad.forEach(([x, y], v) => {
      pos.set([x, y, z], q * 18 + v * 3);
      col.set([b.color.r, b.color.g, b.color.b, alpha], q * 24 + v * 4);
    });
    q++;
  }
  trailGeometry.setDrawRange(0, q * 6);
  trailGeometry.attributes.position.needsUpdate = true;
  trailGeometry.attributes.color.needsUpdate = true;
}

// ---- Camera: high and wide at both ends, close between. It stands at the
// robot's right-hand side on the leg with the box, a little behind, so that
// the robot drives from left to right towards the box and the box's near
// face, where the lidar's points fall, is visible. ----
const centre = [];
for (let k = 0; k < N; k++) { const p = poseAt(k / FPS); centre.push([p.x, p.y]); }
function blur(a, r) {
  return a.map((_, i) => { let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - r); j <= Math.min(a.length - 1, i + r); j++) { sx += a[j][0]; sy += a[j][1]; n++; }
    return [sx / n, sy / n]; });
}
const soft = blur(blur(centre, 36), 36);
const mix = (a, b, k) => a + (b - a) * k;
const SIDE = D.box.yaw - Math.PI / 2 - 0.42;
const routeCentre = ROUTE.reduce((s, p) => [s[0] + p[0] / ROUTE.length, s[1] + p[1] / ROUTE.length], [0, 0]);
function placeCamera(k) {
  const t = k / FPS;
  const close = smooth((t - 2.6) / 4.2) * (1 - smooth((t - (CARD.endStart - 1.2)) / 3.4));
  // While the box is there, look between the robot and the box.
  const boxed = 0.5 * window01(t, D.box.from - 0.6, D.box.to + 1.0, 1.6);
  const fx = mix(soft[k][0], D.box.x, boxed), fy = mix(soft[k][1], D.box.y, boxed);
  const tx = mix(routeCentre[0], fx, close), ty = mix(routeCentre[1], fy, close);
  const distance = mix(10.5, 2.75, close), elevation = mix(0.95, 0.60, close);
  const azimuth = SIDE + 0.16 * Math.sin((t - 8) * 0.045) - 0.35 * (1 - close);
  camera.position.set(tx + distance * Math.cos(elevation) * Math.cos(azimuth),
                      ty + distance * Math.cos(elevation) * Math.sin(azimuth),
                      distance * Math.sin(elevation));
  camera.lookAt(tx, ty, 0.10);
  sun.target.position.set(fx, fy, 0);
  sun.position.set(fx + 2.6, fy - 3.4, 7.5);
}

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(WIDTH, HEIGHT,
  { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH, HEIGHT), 0.32, 0.6, 0.92));
composer.addPass(new OutputPass());

window.totalFrames = N;
window.renderFrame = async function (k) {
  const t = k / FPS;
  const { state, body, color } = update(t);
  const p = poseAt(t);
  base.position.set(p.x, p.y, 0);
  base.rotation.z = p.yaw;
  wheels.forEach((w, side) => {
    w.rotation.y = wheel[p.i][side] + (wheel[Math.min(p.i + 1, wheel.length - 1)][side] - wheel[p.i][side]) * p.k;
  });
  robot.userData.head.rotation.z = t * 9;
  ledMat.color.set(color);

  for (const [name, z] of Object.entries(zones)) {
    const lit = litAt(name, t);
    z.fill.material.opacity = body * mix(0.03, 0.40, lit);
    z.edge.material.opacity = body * mix(0.38, 1.0, lit);
  }

  // The box is there from the 'dropped' event to the 'removed' event.
  const there = t >= D.box.from && t < D.box.to;
  box.visible = there;
  if (there) {
    const grow = ease((t - D.box.from) / 0.25);
    box.scale.set(1, 1, Math.max(0.02, grow));
    box.position.z = D.box.size / 2 * Math.max(0.02, grow);
    box.material.opacity = body;
    boxEdges.material.opacity = 0.55 * body;
  }

  drawScan(t, body);
  route.children.forEach((m) => { m.material.opacity = (m.geometry === dash ? 0.34 : 0.5) * body; });
  drawTrail(t);
  trail.material.opacity = body;

  placeCamera(k);
  composer.render();

  const top = new THREE.Vector3(p.x + BODY_X * Math.cos(p.yaw), p.y + BODY_X * Math.sin(p.yaw), 0.22).project(camera);
  tag.style.left = (top.x + 1) / 2 * WIDTH + 'px';
  tag.style.top = (1 - top.y) / 2 * HEIGHT - 12 + 'px';
  tag.style.background = color;
  tag.textContent = stateLabel(state);
  tag.style.opacity = body;
};
</script>
</body>
</html>
