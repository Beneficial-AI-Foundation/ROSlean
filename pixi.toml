[workspace]
name = "roslean"
version = "0.1.0"
description = "Lean-verified ROS 2 nodes (twist_mux first)"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-std-msgs = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
compilers = "*"
pkg-config = "*"
make = "*"
ros-jazzy-twist-mux = ">=4.5.0,<5"
ros-jazzy-turtlesim = ">=1.8.4,<2"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
ros-jazzy-ros-gz = ">=1.0.23,<2"
ros-jazzy-turtlebot3-gazebo = ">=2.3.7,<3"
ros-jazzy-navigation2 = ">=1.3.12,<2"
ros-jazzy-nav2-bringup = ">=1.3.12,<2"
ros-jazzy-turtlebot3-description = ">=2.3.6,<3"
ros-jazzy-rviz2 = ">=14.1.23,<15"

[tasks]

build = { cmd = "colcon build --symlink-install --base-paths ros --cmake-args -G Ninja" }
noop = { cmd = "bash -c 'source install/setup.bash && ros2 run roslean_noop noop_node'", depends-on = ["build"] }
test = { cmd = "colcon test --base-paths ros --event-handlers console_direct+ && colcon test-result --verbose", depends-on = ["build"] }
prove = "lake exe cache get && lake build ROSlean"
# Run-time comparison with upstream twist_mux (docs/BENCHMARK.md). Fetches upstream's sources.
bench-build = { cmd = "colcon build --symlink-install --base-paths ros bench --cmake-args -G Ninja" }
bench = { cmd = "bash -c 'source install/setup.bash && python3 bench/roslean_bench/scripts/run_bench.py all --out bench/results'", depends-on = ["bench-build"] }
demo = { cmd = "bash -c 'source install/setup.bash && ros2 launch roslean_twist_mux demo_launch.py'", depends-on = ["build"] }
# Run these in other terminals while the demo is up.
# The lock commands wait for both subscribers (the mux and the narrator) and
# send the message five times. With `--once` the command waits for one
# subscriber only and exits; on a busy machine the other one, which may be
# the mux, then never gets the message.
demo-teleop = "bash -c 'source install/setup.bash && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=key_vel'"
demo-estop = "bash -c 'source install/setup.bash && ros2 topic pub -w 2 --times 5 --rate 10 /e_stop std_msgs/msg/Bool \"data: true\"'"
demo-release = "bash -c 'source install/setup.bash && ros2 topic pub -w 2 --times 5 --rate 10 /e_stop std_msgs/msg/Bool \"data: false\"'"
# Gazebo demo: a TurtleBot3 in a furnished apartment (first run downloads the furniture).
gazebo = { cmd = "bash -c 'source install/setup.bash && ros2 launch $(ros2 pkg prefix roslean_twist_mux)/share/roslean_twist_mux/demo/gazebo/gazebo_launch.py'", depends-on = ["build"] }
gazebo-nav2 = { cmd = "bash -c 'source install/setup.bash && ros2 launch $(ros2 pkg prefix roslean_twist_mux)/share/roslean_twist_mux/demo/gazebo/gazebo_launch.py planner:=nav2'", depends-on = ["build"] }
# With gazebo-nav2 running and tour:=false: pixi run gazebo-goal X Y  (map coordinates, metres)
gazebo-goal = "bash -c 'source install/setup.bash && ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose \"{pose: {header: {frame_id: map}, pose: {position: {x: $0, y: $1}, orientation: {w: 1.0}}}}\"'"
gazebo-teleop = "bash -c 'source install/setup.bash && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=key_vel -p stamped:=true -p speed:=0.2 -p turn:=1.0'"
# Collision monitor demo (docs/TUTORIAL_COLLISION_MONITOR.md): the mux and the
# monitor in series on the TurtleBot3. cm-gazebo-scenario drops a box in front
# of the robot and takes it away again by itself.
cm-gazebo = { cmd = "bash -c 'source install/setup.bash && ros2 launch $(ros2 pkg prefix roslean_collision_monitor)/share/roslean_collision_monitor/demo/gazebo/cm_gazebo_launch.py'", depends-on = ["build"] }
cm-gazebo-scenario = { cmd = "bash -c 'source install/setup.bash && ros2 launch $(ros2 pkg prefix roslean_collision_monitor)/share/roslean_collision_monitor/demo/gazebo/cm_gazebo_launch.py scenario:=true'", depends-on = ["build"] }
cm-gazebo-nav2 = { cmd = "bash -c 'source install/setup.bash && ros2 launch $(ros2 pkg prefix roslean_collision_monitor)/share/roslean_collision_monitor/demo/gazebo/cm_gazebo_launch.py planner:=nav2'", depends-on = ["build"] }
# With cm-gazebo running: put a box 1.2 m in front of the robot; take it away.
cm-box-drop = "bash -c 'source install/setup.bash && python3 ros/roslean_collision_monitor/demo/gazebo/obstacle.py drop'"
cm-box-remove = "bash -c 'source install/setup.bash && python3 ros/roslean_collision_monitor/demo/gazebo/obstacle.py remove'"
# Runs the scenario without windows and checks it against the simulator's
# ground truth (about a minute). For upstream's node: pixi run cm-check --monitor nav2_collision_monitor
cm-check = { cmd = "bash -c 'source install/setup.bash && python3 ros/roslean_collision_monitor/demo/gazebo/check_demo.py \"$@\"' --", depends-on = ["build"] }
