# Configuration for the main scenarios in test/scenario.py. Valid for both
# this package and upstream twist_mux.
# Timeouts are binary fractions so that upstream's floating-point arithmetic
# is exact at the boundaries the scenarios probe.
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : nav_vel
        timeout : 0.5
        priority: 10
      keyboard:
        topic   : key_vel
        timeout : 0.5
        priority: 90
      joystick:
        topic   : joy_vel
        timeout : 0.5
        priority: 100
    locks:
      watchdog:
        # Has a timeout: a silent publisher locks everything below 50.
        topic   : watchdog
        timeout : 0.25
        priority: 50
      pause:
        topic   : pause_navigation
        timeout : 0.0
        priority: 100
      e_stop:
        topic   : e_stop
        timeout : 0.0
        priority: 255
