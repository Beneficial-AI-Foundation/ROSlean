# Collision monitor configuration for the Gazebo demo: a stop zone close to
# the TurtleBot3 burger and a slowdown zone ahead of it.
#
# The same file is given to the Lean node and, with monitor_package:=
# nav2_collision_monitor, to upstream's node. Everything in it is upstream's
# format except `scan.roslean_sensor_pose`, which upstream does not declare
# and therefore ignores.
#
# The node is called `cm_gate` in the demo, not `collision_monitor`, because
# with planner:=nav2 the Nav2 bring-up starts a `collision_monitor` of its own
# (upstream's, inside the planner) and two nodes must not share a name.
cm_gate:
  ros__parameters:
    # Input: the output of twist_mux. Output: what the base watchdog passes on
    # to the robot.
    cmd_vel_in_topic: "cmd_vel_mux"
    cmd_vel_out_topic: "cmd_vel_monitored"
    enable_stamped_cmd_vel: true
    # The simulated lidar publishes 5 scans a second, stamped with simulated
    # time. A scan older than this stops the robot.
    source_timeout: 1.0
    # Zero is published for this long after it first appears, then nothing;
    # from then on the base watchdog holds the robot (SPEC R15, A3).
    stop_pub_timeout: 1.0
    # The Lean node requires this line (SPEC D11): upstream's default is true.
    base_shift_correction: false
    base_frame_id: "base_footprint"
    # Zones, in the base frame (x ahead, y to the left, metres). The burger's
    # body reaches from x = -0.10 to x = +0.04 and is 0.18 m wide over the
    # wheels.
    polygons: ["Stop", "Slow"]
    Stop:
      type: "polygon"
      points: "[[0.30, 0.14], [0.30, -0.14], [-0.14, -0.14], [-0.14, 0.14]]"
      action_type: "stop"
      min_points: 4
      enabled: true
    Slow:
      type: "polygon"
      points: "[[0.70, 0.22], [0.70, -0.22], [-0.14, -0.22], [-0.14, 0.22]]"
      action_type: "slowdown"
      slowdown_ratio: 0.4
      min_points: 4
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: true
      # The scan is in the frame `base_scan`, not in the base frame, and the
      # Lean node looks up no transform (SPEC D11), so the lidar's pose in
      # `base_footprint` is given here: [x, y, yaw]. The numbers are the
      # robot's: turtlebot3_burger.urdf has base_footprint -> base_link at
      # xyz (0, 0, 0.010) and base_link -> base_scan (`scan_joint`) at
      # xyz (-0.032, 0, 0.172), both with rpy (0, 0, 0); the simulated sensor
      # in turtlebot3_gazebo's model.sdf sits at the same x and y. The lidar
      # is mounted upright, so [x, y, yaw] describes it fully; the height
      # does not matter for a planar scan.
      roslean_sensor_pose: [-0.032, 0.0, 0.0]
