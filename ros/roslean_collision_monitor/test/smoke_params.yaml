# Configuration of the smoke test (smoke_node.py). Zone order matters: the
# slowdown zones come first, so that a stop must win over an earlier slowdown.
collision_monitor:
  ros__parameters:
    source_timeout: 2.0
    stop_pub_timeout: 1.0
    base_shift_correction: false
    base_frame_id: "base_link"
    polygons: ["Slow", "SlowWide", "Stop"]
    Slow:
      type: "circle"
      radius: 0.6
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 3
    SlowWide:
      type: "circle"
      radius: 1.0
      action_type: "slowdown"
      slowdown_ratio: 0.75
      min_points: 3
    Stop:
      type: "polygon"
      points: "[[0.3, 0.3], [0.3, -0.3], [0.0, -0.3], [0.0, 0.3]]"
      action_type: "stop"
      min_points: 3
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
